name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Отменяем предыдущий прогон для той же ветки — экономим минуты CI
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint · types · tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: komi
          POSTGRES_PASSWORD: komi_password
          POSTGRES_DB: gastro_komi
        ports:
          - 5432:5432
        # globalSetup в jest создаёт gastro_komi_test сам (см. .env.test)
        options: >-
          --health-cmd "pg_isready -U komi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Установка зависимостей
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Генерация Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Линтер
        working-directory: backend
        run: npm run lint

      - name: Проверка типов
        working-directory: backend
        run: npm run typecheck

      - name: Тесты (unit + integration, coverage >= 80%)
        working-directory: backend
        run: npm test
        env:
          # Явный DSN тестовой базы: значение одноразовое, только для CI
          TEST_DATABASE_URL: postgresql://komi:komi_password@localhost:5432/gastro_komi_test?schema=public

  frontend:
    name: Frontend (lint · types · tests · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установка зависимостей
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Линтер
        working-directory: frontend
        run: npm run lint

      - name: Проверка типов
        working-directory: frontend
        run: npm run typecheck

      - name: Тесты (coverage >= 70%)
        working-directory: frontend
        run: npm test

      - name: Production-сборка
        working-directory: frontend
        # NEXT_PUBLIC_* в проде задаёт docker compose (см. docker-compose.yml):
        # здесь важна сама проверка, что сборка проходит
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: /api
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_SITE_NAME: Гастрономия Коми

  docs:
    name: Docs (MkDocs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Сборка документации
        working-directory: docs
        run: |
          pip install --no-cache-dir mkdocs==1.6.1 mkdocs-material==9.5.34
          mkdocs build

  docker:
    name: Docker-образы
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Сборка образа backend
        run: docker build -f backend/Dockerfile -t gastro-komi-backend:ci .

      - name: Сборка образа frontend
        run: |
          docker build -f frontend/Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL=/api \
            --build-arg NEXT_PUBLIC_SITE_URL=http://localhost:3000 \
            --build-arg NEXT_PUBLIC_SITE_NAME=Гастрономия Коми \
            -t gastro-komi-frontend:ci \
            frontend
